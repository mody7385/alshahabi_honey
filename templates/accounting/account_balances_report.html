{% extends 'base.html' %}

{% block title %}أرصدة الحسابات{% endblock %}

{% block content %}
<div class="hero-card"><h2>أرصدة الحسابات</h2></div>
<div class="panel-card">
    <table class="custom-table">
        <thead><tr><th>الحساب</th><th>النوع</th><th>الرصيد</th></tr></thead>
        <tbody>
            {% for item in balances %}
            <tr><td>{{ item.name }}</td><td>{{ item.type }}</td><td>{{ item.balance }}</td></tr>
            {% empty %}
            <tr><td colspan="3">لا توجد حسابات.</td></tr>
            {% endfor %}
        </tbody>
    </table>
</div>
{% endblock %}
