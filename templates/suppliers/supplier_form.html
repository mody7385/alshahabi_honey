{% extends 'base.html' %}

{% block title %}{{ page_title }}{% endblock %}

{% block content %}
<div class="hero-card">
    <h2>{{ page_title }}</h2>
    <p class="muted">إدخال أو تعديل بيانات المورد.</p>
</div>

<div class="panel-card">
    <form method="post">
        {% csrf_token %}

        <div class="grid">
            <div class="col-6">
                <label>اسم المورد</label>
                {{ form.name }}
            </div>

            <div class="col-6">
                <label>رقم الجوال</label>
                {{ form.phone }}
            </div>

            <div class="col-12">
                <label>العنوان</label>
                {{ form.address }}
            </div>

            <div class="col-12">
                <label>ملاحظات</label>
                {{ form.notes }}
            </div>

            <div class="col-12">
                <label>الحالة</label>
                {{ form.is_active }}
            </div>
        </div>

        <div class="actions">
            <button type="submit" class="btn">{{ submit_label }}</button>
            <a href="{% url 'supplier-list' %}" class="btn btn-secondary">رجوع</a>
        </div>
    </form>
</div>
{% endblock %}
