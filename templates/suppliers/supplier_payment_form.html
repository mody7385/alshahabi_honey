{% extends 'base.html' %}

{% block title %}{{ page_title }}{% endblock %}

{% block content %}
<div class="hero-card">
    <h2>{{ page_title }}</h2>
    <p class="muted">تسجيل مبلغ تم سداده للمورد.</p>
</div>

<div class="panel-card">
    <form method="post">
        {% csrf_token %}

        <div class="grid">
            <div class="col-6">
                <label>المورد</label>
                {{ form.supplier }}
            </div>

            <div class="col-6">
                <label>المبلغ المسدد</label>
                {{ form.amount }}
            </div>

            <div class="col-6">
                <label>تاريخ السداد</label>
                {{ form.payment_date }}
            </div>

            <div class="col-12">
                <label>ملاحظات</label>
                {{ form.notes }}
            </div>
        </div>

        <div class="actions">
            <button type="submit" class="btn">{{ submit_label }}</button>
            <a href="{% url 'supplier-list' %}" class="btn btn-secondary">رجوع</a>
        </div>
    </form>
</div>
{% endblock %}
